<main id="main">
  <div class="phead"><div class="wrap">
    <h1>{{page.heading}}</h1>
    <div class="seg" id="leagues" role="tablist" aria-label="League"></div>
  </div></div>
  <div class="wrap">
    <div class="chips" id="chips"></div>
    <p class="stamp-line" id="stamp"></p>
    <div id="view"></div>
  </div>
</main>
{{> footer}}
<script>
(async function(){
  const VIEW="{{page.view}}";
  const {S,esc,param,league,loadFixtures,table,divGames,formHTML,fmtDay,ymd,photoURL,slug,shirt,bibSVG,clash,stripShirts}=S6;
  const $=id=>document.getElementById(id), today=ymd(new Date());
  let saved=""; try{ saved=localStorage.getItem("s6-league")||""; }catch(e){}
  const st={l:(league(param("l"))||league(saved)||S.leagues[0]).id, d:param("d")};
  const cache={}, photosBy={};
  async function data(id){ if(!cache[id]){ cache[id]=await loadFixtures(league(id))||[];
      try{ const r=await fetch(`/.netlify/functions/team-photo?l=${id}&list=1`); photosBy[id]=r.ok?new Set((await r.json()).teams):new Set(); }catch(e){ photosBy[id]=new Set(); } }
    return cache[id]; }
  function url(){ const u=new URL(location.href); u.searchParams.set("l",st.l); u.searchParams.set("d",st.d); history.replaceState(null,"",u); try{ localStorage.setItem("s6-league",st.l); }catch(e){} }
  async function render(){
    const L=league(st.l); if(!L.divisions.some(d=>d.name===st.d)) st.d=L.divisions[0].name; url();
    document.title=`{{page.heading}} · ${L.name} | ${S.siteName}`;
    $("leagues").innerHTML=S.leagues.map(l=>`<button role="tab" aria-selected="${l.id===st.l}" data-l="${l.id}">${esc(l.night)}</button>`).join("");
    $("chips").innerHTML=L.divisions.map(d=>`<button aria-pressed="${d.name===st.d}" data-d="${esc(d.name)}">${esc(d.name)}</button>`).join("");
    const fx=await data(L.id), photos=photosBy[L.id], g=divGames(fx,st.d), V=$("view");
    $("stamp").textContent=fx.updated?`Updated ${new Date(fx.updated).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`:"";
    const avatar=(t,n)=>photos.has(slug(t))?`<span class="crest"><img src="${photoURL(L.id,t)}" alt="" loading="lazy"></span>`:shirt(L.id,t,n);
    const tlink=t=>`<a class="tname" href="/team.html?l=${L.id}&t=${encodeURIComponent(t)}">${avatar(t,28)}<span>${esc(t)}</span></a>`;
    const side=(t,win,cls,bib)=>`<span class="${cls}${win?" win":""}">${cls==="a"?(bib?bibSVG(22,`${t} in bibs`):shirt(L.id,t,22)):""}<a href="/team.html?l=${L.id}&t=${encodeURIComponent(t)}">${esc(t)}</a>${cls==="h"?shirt(L.id,t,22):""}</span>`;
    const row=x=>{ const c=!x.played&&clash(L.id,x.home,x.away);
      return `<div class="match">${side(x.home,x.played&&x.hs>x.as,"h")}<span class="sc${x.played?"":" ko"}">${x.played?`${x.hs} – ${x.as}`:esc(x.time||"TBC")}</span>${side(x.away,x.played&&x.as>x.hs,"a",c)}
        ${!x.played&&x.pitch?`<small>${esc(x.pitch)}</small>`:""}${c?`<span class="clash">Shirt clash: ${esc(x.away)} wear bibs</span>`:""}</div>`; };
    const byWeek=(list,desc)=>{ const m=new Map(); list.forEach(x=>{ if(!m.has(x.ymd)) m.set(x.ymd,[]); m.get(x.ymd).push(x); });
      let ks=[...m.keys()].sort(); if(desc) ks.reverse();
      return ks.map(k=>`<section class="week"><h3>${esc(fmtDay(k))}</h3><div class="card">${m.get(k).map(row).join("")}</div></section>`).join(""); };
    if(VIEW==="tables"){
      const t=table(g);
      if(!t.some(r=>r.p>0)){ V.innerHTML=t.length?`<div class="card tablewrap"><table class="lt"><thead><tr><th>#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr></thead><tbody>${t.map((r,i)=>`<tr><td class="pos">${i+1}</td><td>${tlink(r.team)}</td><td>0</td><td>0</td><td class="pts">0</td></tr>`).join("")}</tbody></table></div><p class="note">The table fills in once the first results are in.</p>`:`<div class="card empty">No teams loaded for ${esc(st.d)} yet.</div>`; return; }
      V.innerHTML=`<div class="card tablewrap"><table class="lt"><thead><tr><th>#</th><th>Team</th><th>P</th><th class="hide-sm">W</th><th class="hide-sm">D</th><th class="hide-sm">L</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>
      ${t.map(r=>`<tr class="${r.pos===1?"top":""}"><td class="pos">${r.pos}</td><td>${tlink(r.team)}</td><td>${r.p}</td><td class="hide-sm">${r.w}</td><td class="hide-sm">${r.d}</td><td class="hide-sm">${r.l}</td><td>${r.gd>0?"+":""}${r.gd}</td><td class="pts">${r.pts}</td><td>${formHTML(r.form,5)}</td></tr>`).join("")}</tbody></table></div>`;
    } else if(VIEW==="results"){ const p=g.filter(x=>x.played); V.innerHTML=p.length?byWeek(p,true):`<div class="card empty">No results yet for ${esc(st.d)}.</div>`; }
    else { const u=g.filter(x=>!x.played&&x.ymd>=today); V.innerHTML=u.length?byWeek(u,false):`<div class="card empty">No upcoming fixtures for ${esc(st.d)}.</div>`; }
  }
  $("leagues").onclick=e=>{ const l=e.target.dataset.l; if(l){ st.l=l; st.d=null; render(); } };
  $("chips").onclick=e=>{ const d=e.target.dataset.d; if(d){ st.d=d; render(); } };
  render();
})();
</script>
